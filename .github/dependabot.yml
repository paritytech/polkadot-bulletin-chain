version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # No version-update PRs (deps track the pinned polkadot-sdk), but let
    # security updates through; ignore-all made those jobs fail with
    # all_versions_ignored instead of opening lockfile bumps.
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/console-ui"
    schedule:
      interval: "weekly"
    groups:
      console-ui-deps:
        applies-to: version-updates
        patterns:
          - "*"
      console-ui-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    groups:
      sdk-typescript-deps:
        applies-to: version-updates
        patterns:
          - "*"
      sdk-typescript-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/examples"
    schedule:
      interval: "weekly"
    groups:
      examples-deps:
        applies-to: version-updates
        patterns:
          - "*"
      examples-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-deps:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"